<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divizioni in gruppi</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: auto; 
            padding: 20px; 
            background-color: black;  /* Sfondo nero */
            color: white;  /* Testo bianco */
        }
        .group { 
            border: 1px solid white; /* Bordo bianco */
            padding: 10px; 
            margin-top: 10px;
        }
        #fightResult { 
            font-size: 1.2em; 
            font-weight: bold; 
            margin-top: 20px;
        }
        button {
            background-color: rgb(58, 58, 58); /* Bottone grigio */
            color: white; /* Testo bianco */
            border: none;
            padding: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: darkgray; /* Cambio colore al passaggio */
        }
        /* Stile della modale */
        .modal {
            display: none; /* Inizialmente nascosta */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: white; color: black;
            margin: 15% auto; padding: 20px;
            width: 50%; text-align: center;
            border-radius: 10px;
        }
    </style>    
</head>
<body>
    <h1>Divizioni in gruppi</h1>
    
    <h2>Seleziona i presenti</h2>
    <button onclick="openSelectionModal()">Seleziona i presenti</button>
    <br>
    <br>

    <!-- Messagebox (modale) -->
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <h2>Seleziona i presenti</h2>
            <div id="nameSelection"></div>
            <button onclick="updateSelectedNames()">Conferma</button>
        </div>
    </div>

    <label for="groupCount">Quanti gruppi:</label>
    <select id="groupCount">
        <option value="2">2</option>
        <option value="4">4</option>
    </select>
    <button onclick="splitIntoGroups()">Dividi i gruppi</button>
    <div id="groups"></div>
    
    <h2>Cambia nome</h2>
    <div id="groupNames"></div>
    <button onclick="renameGroups()">Cambia nome</button>
    
    <h2>Seleziona gruppo per combattere</h2>
    <label for="groupSelect1">Gruppo 1:</label>
    <select id="groupSelect1"></select>
    <label for="groupSelect2">Gruppo 2:</label>
    <select id="groupSelect2"></select>
    <button onclick="generateFight()">Inizia il combattimento</button>
    <div id="fightResult"></div>
    <h2>Risultati</h2>
    <div id="scoreboard"></div>
    
    <script>
        let currentGroups = [];
        let selectedFighters = new Set();
        let groupScores = {};
        let currentFight = [];

        let allNames = []; // Lista completa dei nomi
        let selectedNames = []; // Lista dei nomi selezionati

        fetch("names.json")
            .then(response => response.json())
            .then(data => {
                allNames = data.names;
                displayNameSelection(); // Mostra la lista di selezione
            })
            .catch(error => console.error("Error loading names.json:", error));

        function openSelectionModal() {
            document.getElementById("selectionModal").style.display = "block";
        }

        function displayNameSelection() {
            const selectionContainer = document.getElementById("nameSelection");
            selectionContainer.innerHTML = ""; // Pulisce la lista

            allNames.forEach(name => {
                const label = document.createElement("label");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = name;
                checkbox.checked = true; // Di default tutti selezionati

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(name));
                selectionContainer.appendChild(label);
                selectionContainer.appendChild(document.createElement("br"));
            });
        }

        function updateSelectedNames() {
            selectedNames = []; // Svuota la selezione

            const checkboxes = document.querySelectorAll("#nameSelection input[type='checkbox']");
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    selectedNames.push(checkbox.value);
                }
            });

            document.getElementById("selectionModal").style.display = "none"; // Chiude la modale
            alert("Selection updated! Now create the groups.");
        }

        function splitIntoGroups() {
            const groupCount = parseInt(document.getElementById("groupCount").value);
            if (selectedNames.length === 0) {
                alert("File non caricato, controlla che sia inserito bene nel server");
                return;
            }
            
            const shuffled = [...selectedNames].sort(() => Math.random() - 0.5);
            currentGroups = Array.from({ length: groupCount }, () => []);
            shuffled.forEach((name, index) => {
                currentGroups[index % groupCount].push(name);
            });
            selectedFighters.clear();
            groupScores = {};
            
            const groupsContainer = document.getElementById("groups");
            groupsContainer.innerHTML = "";
            const groupNamesContainer = document.getElementById("groupNames");
            groupNamesContainer.innerHTML = "";
            const groupSelect1 = document.getElementById("groupSelect1");
            const groupSelect2 = document.getElementById("groupSelect2");
            groupSelect1.innerHTML = "";
            groupSelect2.innerHTML = "";

            console.log(groupsContainer);

            currentGroups.forEach((group, i) => {
                const groupDiv = document.createElement("div");
                groupDiv.className = "group";
                groupDiv.id = `group${i}`;
                
                let groupList = "<ul>";
                group.forEach(member => {
                    groupList += `<li>${member}</li>`;
                });
                groupList += "</ul>";
                
                groupDiv.innerHTML = `<h2>Group ${i + 1}</h2>${groupList}`;
                groupsContainer.appendChild(groupDiv);
                
                const input = document.createElement("input");
                input.type = "text";
                input.placeholder = `Group ${i + 1} Name`;
                input.id = `groupName${i}`;
                groupNamesContainer.appendChild(input);
                groupNamesContainer.appendChild(document.createElement("br"));
                
                let option1 = document.createElement("option");
                let option2 = document.createElement("option");
                option1.value = i;
                option2.value = i;
                option1.textContent = `Group ${i + 1}`;
                option2.textContent = `Group ${i + 1}`;
                groupSelect1.appendChild(option1);
                groupSelect2.appendChild(option2);
            });
            updateScoreboard();
        }

        function renameGroups() {
            currentGroups.forEach((_, i) => {
                const newName = document.getElementById(`groupName${i}`).value.trim();
                if (newName) {
                    document.getElementById(`group${i}`).querySelector("h2").textContent = newName;
                    updateGroupSelectors();
                }
            });
        }

        function updateGroupSelectors() {
            const groupSelect1 = document.getElementById("groupSelect1");
            const groupSelect2 = document.getElementById("groupSelect2");
            groupSelect1.innerHTML = "";
            groupSelect2.innerHTML = "";
            
            currentGroups.forEach((_, i) => {
                const groupName = document.getElementById(`group${i}`).querySelector("h2").textContent;
                let option1 = document.createElement("option");
                let option2 = document.createElement("option");
                option1.value = i;
                option2.value = i;
                option1.textContent = groupName;
                option2.textContent = groupName;
                groupSelect1.appendChild(option1);
                groupSelect2.appendChild(option2);
            });
        }
        
        function generateFight() {
            console.log("1");

            const group1Index = parseInt(document.getElementById("groupSelect1").value);
            const group2Index = parseInt(document.getElementById("groupSelect2").value);
            
            if (group1Index === group2Index) {
                alert("Select two different groups to fight.");
                return;
            }
            
            const group1 = currentGroups[group1Index].filter(member => !selectedFighters.has(member));
            const group2 = currentGroups[group2Index].filter(member => !selectedFighters.has(member));
            const group1Buff = currentGroups[group1Index];
            const group2Buff = currentGroups[group2Index];
            
            if (group1.length === 0 && group2.length === 0) {
                alert("Tutti han combattuto.");
                return;
            }
            else if(group1.length > 0 && group2.length === 0) {
                console.log("manca grup 2");
                console.log(group1.length + "  " + group2.length);
                console.log(selectedFighters);
                const fighter2 = group2Buff[Math.floor(Math.random())];
                const fighter1 = group1[Math.floor(Math.random() * group2.length)];
                cousefight(fighter1, fighter2, group1Index, group2Index); 
            }
            else if(group2.length > 0 && group1.length === 0) {
                console.log("manca grup 1");
                console.log(group1.length + "  " + group2.length);
                console.log(selectedFighters);
                const fighter2 = group2[Math.floor(Math.random() * group1.length)];
                const fighter1 = group1Buff[Math.floor(Math.random())];
                cousefight(fighter1, fighter2, group1Index, group2Index); 
            }
            else if(group1.length > 0 && group2.length > 0){
                console.log("ci son tutti");
                console.log(group1.length + "  " + group2.length);
                const fighter1 = group1[Math.floor(Math.random() * group1.length)];
                const fighter2 = group2[Math.floor(Math.random() * group2.length)];  
                cousefight(fighter1, fighter2, group1Index, group2Index); 
            }
            
            /*
            selectedFighters.add(fighter1);
            selectedFighters.add(fighter2);
            currentFight = [fighter1, fighter2];
            document.getElementById("fightResult").innerHTML = `Fight: ${fighter1} vs ${fighter2} <br>
            <button onclick="declareWinner('${fighter1}', ${group1Index})">${fighter1} Wins</button>
            <button onclick="declareWinner('${fighter2}', ${group2Index})">${fighter2} Wins</button>`; */
        }

        function cousefight(fighter1, fighter2, group1Index, group2Index) {
            selectedFighters.add(fighter1);
            selectedFighters.add(fighter2);
            updateFighterStatus(); // Aggiorna la visualizzazione
            
            currentFight = [fighter1, fighter2];
            document.getElementById("fightResult").innerHTML = `Fight: ${fighter1} vs ${fighter2} <br>
            <button onclick="declareWinner('${fighter1}', ${group1Index})">${fighter1} Vince</button>
            <button onclick="declareWinner('${fighter2}', ${group2Index})">${fighter2} Vince</button>`;
        }

        function declareWinner(winner, groupIndex) {
            const groupName = document.getElementById(`group${groupIndex}`).querySelector("h2").textContent;
            groupScores[groupName] = (groupScores[groupName] || 0) + 1;
            updateScoreboard();
            document.getElementById("fightResult").innerHTML = `${winner} Vince!`;
        }

        function updateScoreboard() {
            const scoreboard = document.getElementById("scoreboard");
            scoreboard.innerHTML = "<h3>Risultato</h3>";
            for (let group in groupScores) {
                scoreboard.innerHTML += `<p>${group}: ${groupScores[group]}</p>`;
            }
        }

        function updateFighterStatus() {
            currentGroups.forEach((group, i) => {
            const groupDiv = document.getElementById(`group${i}`);
            const listItems = groupDiv.getElementsByTagName("li");

            for (let item of listItems) {
             if (selectedFighters.has(item.textContent)) {
                    item.style.textDecoration = "line-through"; // Barra il nome se è stato selezionato
                } else {
                    item.style.textDecoration = "none"; // Ripristina se non è stato scelto
                }
            }
        });
}

    </script>
</body>
</html>
